<!-- FIREBASE -->
<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  initializeAuth,
  GoogleAuthProvider,
  signInWithPopup,
  browserLocalPersistence,
  indexedDBLocalPersistence,
  browserPopupRedirectResolver,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyCFYGvmhpYPNRjjf1gft4qLxuhROZ3lbz4",

  authDomain:
    "kibo-4628d.firebaseapp.com",

  projectId:
    "kibo-4628d",

  storageBucket:
    "kibo-4628d.firebasestorage.app",

  messagingSenderId:
    "978546474276",

  appId:
    "1:978546474276:web:a7ed1720809e5d2eaa47b1",

  measurementId:
    "G-S86TM0DV2Y"
};


/* INITIALIZE */

const firebaseApp = initializeApp(firebaseConfig);

// Use durable browser persistence with IndexedDB first and localStorage
// as a fallback. Explicitly provide the popup resolver for mobile browsers.
const auth = initializeAuth(firebaseApp, {
  persistence: [
    indexedDBLocalPersistence,
    browserLocalPersistence
  ],
  popupRedirectResolver: browserPopupRedirectResolver
});

const db = getFirestore(firebaseApp);

const provider = new GoogleAuthProvider();
// Do not force account selection. Returning users keep their Firebase session
// and do not need to choose their Google account again.



/* ELEMENTS */

const login =
  document.getElementById("login");

const app =
  document.getElementById("app");

const error =
  document.getElementById("error");

const googleLogin =
  document.getElementById("googleLogin");

const logoutBtn =
  document.getElementById("logoutBtn");

const frame =
  document.getElementById("lessonFrame");

const buttons =
  [...document.querySelectorAll("[data-lesson]")];


/* TEST SOURCES */

const sources = {

  "읽기 1–2":"test-01.html",

  "읽기 3–4":"test-02.html",

  "읽기 5":"test-03.html",

  "읽기 6":"test-04.html",

  "읽기 7":"test-05.html",

  "읽기 8":"test-06.html",

  "읽기 9":"test-07.html",

  "읽기 10":"test-08.html",

  "읽기 11–12":"test-09.html",

  "읽기 13–15":"test-10.html",

  "읽기 16–18":"test-11.html",

  "읽기 19–20":"test-12.html",

  "읽기 21–22":"test-13.html",

  "읽기 23–24":"test-14.html",

  "읽기 25–27":"test-15.html",

  "읽기 28–31":"test-16.html"

};


/* OPEN LESSON */

function openLesson(label){

  buttons.forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.lesson === label
    );

  });

  app.classList.remove("home");
  frame.style.height = "100vh";
  frame.src = sources[label];

}


/* GOOGLE LOGIN */

googleLogin.addEventListener(
  "click",
  async () => {

    error.textContent = "";

    // Keep the protected app hidden until Firestore approval is confirmed.
    login.style.display = "grid";
    app.style.display = "none";
    app.setAttribute("aria-hidden", "true");

    googleLogin.disabled = true;

    googleLogin.textContent =
      "Kirish...";

    try{

      await signInWithPopup(
        auth,
        provider
      );

    }catch(err){

      console.error(err);

      // A cancelled/closed Google popup must never reveal the app.
      login.style.display = "grid";
      app.style.display = "none";
      app.setAttribute("aria-hidden", "true");
      app.classList.add("home");
      frame.src = "about:blank";

      if(err?.code === "auth/popup-closed-by-user" ||
         err?.code === "auth/cancelled-popup-request"){
        error.textContent = "Google orqali kirish bekor qilindi.";
      }else{
        error.textContent =
          "Google orqali kirishda xatolik yuz berdi.";
      }

      googleLogin.disabled = false;
      googleLogin.textContent =
        "Google orqali kirish";

    }

  }
);


/* LOGOUT */

logoutBtn.addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

    }catch(err){

      console.error(err);

    }

  }
);


/* AUTH STATE */

onAuthStateChanged(
  auth,
  async user => {
    // Never expose the app until the Firestore approval check succeeds.
    login.style.display = "grid";
    app.style.display = "none";
    app.setAttribute("aria-hidden", "true");
    app.classList.add("home");
    frame.src = "about:blank";

    if(!user){
      // No remembered session: show the login screen.
      login.style.display = "grid";
      return;
    }

    try{
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      // First login: create a pending account, then immediately sign out.
      if(!userSnap.exists()){
        await setDoc(userRef, {
          name: user.displayName || "",
          email: user.email || "",
          approved: false,
          createdAt: serverTimestamp()
        });

        await signOut(auth);
        error.textContent =
          "Hisobingiz yaratildi. Admin tasdiqlashini kuting.";
        return;
      }

      const userData = userSnap.data();

      // Pending/rejected users must remain on the login screen.
      if(userData.approved !== true){
        await signOut(auth);
        error.textContent =
          "Hisobingiz hali tasdiqlanmagan.";
        return;
      }

      // Approved user: show HOME only. Do not auto-open any test.
      login.style.display = "none";
      app.style.display = "grid";
      app.setAttribute("aria-hidden", "false");
      app.classList.add("home");
      frame.src = "about:blank";
      error.textContent = "";

    }catch(err){
      console.error(err);
      error.textContent =
        "Hisobni tekshirishda xatolik yuz berdi.";
      app.style.display = "none";
      app.setAttribute("aria-hidden", "true");
      try{ await signOut(auth); }catch(e){}
    }
  }
);

/* HOME */

function showHome(){

  app.classList.add("home");

  frame.style.height = "100vh";
  frame.src =
    "about:blank";

}


document
  .getElementById("homeBtn")
  .addEventListener(
    "click",
    showHome
  );


/* HOME MESSAGE FROM TEST IFRAMES */
window.addEventListener("message", event => {
  if(event.source !== frame.contentWindow) return;
  if(event.data && event.data.type === "kibo-home"){
    showHome();
    return;
  }
  if(event.data && event.data.type === "kibo-test-height" && Number.isFinite(Number(event.data.height))){
    const h=Math.max(300, Number(event.data.height));
    frame.style.height=h+"px";
  }
});


/* HOME TEST CARDS */

document
  .querySelectorAll("[data-open]")
  .forEach(card => {

    card.addEventListener(
      "click",
      () => {

        const label =
          card.dataset.open;

        app.classList.remove(
          "home"
        );

        openLesson(label);

      }
    );

  });


/* NAV BUTTONS */

buttons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      app.classList.remove(
        "home"
      );

      openLesson(
        button.dataset.lesson
      );

    }
  );

});


</script>
